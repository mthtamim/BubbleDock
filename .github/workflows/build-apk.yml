name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BubbleDock.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDock-apk
          path: BubbleDock.apk
          retention-days: 90

      - name: Publish APK to Release v1.3.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: BubbleDock v1.3.0
          body: |
            BubbleDock v1.3.0 — ছোট লাইন আর সব অ্যাপ:

            • ডক আর অ্যাকশন এখন সিম্পল ছোট লাইন, প্রায় ৫৬dp উঁচু, এক সারিতে আইকন
            • Android ১১+ queries ফিক্স: থার্ড-পার্টি অ্যাপও ফেভারিট, গ্রুপ আর ডকে আসবে
            • ফেভারিট আর রিসেন্ট খালি থাকলে ডক খালি থাকবে না, সব অ্যাপ আসবে
            • বাবল, ডক, অ্যাকশন — কোথাও কোনো লেখা নেই, শুধু আইকন
            • সেটিংস PhoneLink স্টাইলে, লেখা খুব কম, কোনো ব্যাখ্যা নেই
            • সব সেটিংস শুধু ফোনেই থাকে, কোনো সার্ভার নেই
            • v2-তে আসবে: ম্যাক্রো আর PhoneLink/Automation Lab ইন্টিগ্রেশন
          files: BubbleDock.apk
