name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android SDK 34
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BubbleDock.apk

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BubbleDock-apk
          path: BubbleDock.apk
          retention-days: 90

      - name: Publish APK to Release v1.4.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.2
          name: BubbleDock v1.4.2
          body: |
            BubbleDock v1.4.2 — মাঝখানে ক্রস:

            • সার্কুলার মেনুর মাঝখানে এখন ক্রস চিহ্ন থাকবে, চাপলেই মেনু বন্ধ হবে
            • সার্কুলার মেনু আসল রিং: কোনো বর্গাকার প্যানেল নেই, আইকনগুলো বাবলের চারপাশে ভাসবে
            • সাইজ অনেক ছোট: রিং ১৬০dp, আইকন ৩২dp
            • এক ট্যাপে সার্কুলার মেনু, এতে মূলত বিভিন্ন অ্যাকশন
            • ডাবল ট্যাপে সরাসরি Previous recent app
            • লং প্রেসে ডক লাইন, সেটিংস থেকে হরিজন্টাল বা ভার্টিকাল
            • ডকের অ্যাপ সেটিংস থেকে চালু করলে ফ্লোটিং উইন্ডোতে খোলার চেষ্টা করবে (ডিভাইস না মানলে ফুলস্ক্রিন)
            • Android ১১+ queries ফিক্স আগের মতোই আছে, থার্ড-পার্টি অ্যাপ আসবে
            • বাবল, ডক, অ্যাকশন — কোথাও কোনো লেখা নেই, শুধু আইকন
            • সব সেটিংস শুধু ফোনেই থাকে, কোনো সার্ভার নেই
          files: BubbleDock.apk
